name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "构建产物："
          ls -la build/ | head -20
          echo ""
          echo "页面数：$(find build -name '*.html' | wc -l)"
          echo "总大小：$(du -sh build | cut -f1)"
          # 关键文件检查
          test -f build/index.html || (echo "❌ 缺少 index.html" && exit 1)
          test -d build/_app || (echo "❌ 缺少 _app 目录" && exit 1)
          echo "✅ 构建产物校验通过"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=anxi-site --branch=main
